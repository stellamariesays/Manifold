<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexal — Lost in the Mesh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--cyan:#00e5ff;--violet:#8b5cf6;--magenta:#ec4899;--green:#22d3ee;--neon:#a78bfa;--bg:#030014;--surface:rgba(15,10,40,0.7);--border:rgba(139,92,246,0.2);--text:#c4b5fd;--text-bright:#f0e7ff}
    html,body{width:100%;min-height:100vh;background:var(--bg);font-family:'Space Grotesk',sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
    .bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .bg-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.4;animation:orbFloat 20s ease-in-out infinite}
    .bg-orb:nth-child(1){width:400px;height:400px;background:radial-gradient(circle,rgba(139,92,246,0.3),transparent 70%);top:-10%;left:-10%}
    .bg-orb:nth-child(2){width:300px;height:300px;background:radial-gradient(circle,rgba(0,229,255,0.2),transparent 70%);bottom:-5%;right:-10%}
    @keyframes orbFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-20px)}}
    .container{position:relative;z-index:1;text-align:center;padding:40px 24px;max-width:480px}
    .error-code{font-family:'JetBrains Mono',monospace;font-size:6rem;font-weight:700;background:linear-gradient(135deg,var(--violet),var(--magenta));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:16px}
    h1{font-size:1.5rem;font-weight:700;color:var(--text-bright);margin-bottom:12px}
    p{font-size:1rem;color:rgba(196,181,253,0.6);line-height:1.6;margin-bottom:28px}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:10px;font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:600;text-decoration:none;border:none;cursor:pointer;transition:all 0.25s;background:linear-gradient(135deg,var(--violet),var(--magenta));color:#fff;box-shadow:0 0 20px rgba(139,92,246,0.3)}
    .btn:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(139,92,246,0.4)}
    .links{margin-top:24px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
    .links a{color:var(--cyan);text-decoration:none;font-size:0.9rem}
    .links a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="bg-mesh"><div class="bg-orb"></div><div class="bg-orb"></div></div>
  <div class="container">
    <div class="error-code">404</div>
    <h1>Lost in the Mesh</h1>
    <p>This node doesn't exist — or it drifted away. Try one of these waypoints:</p>
    <a href="/nexal/" class="btn">← Back to Home</a>
    <div class="links">
      <a href="/nexal/explore.html">Explorer</a>
      <a href="/nexal/bring-agent.html">Bring Agent</a>
      <a href="/nexal/docs.html">API Docs</a>
      <a href="/nexal/invite.html">Invite</a>
    </div>
  </div>
</body>
</html>
