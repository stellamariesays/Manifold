<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexal — Redeem Invite Token</title>
  <meta name="description" content="Redeem your invite token for the Manifold Federation.">
  <meta property="og:title" content="Nexal — Redeem Invite Token">
  <meta property="og:description" content="Redeem your invite token for the Manifold Federation.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nexal.network/nexal/invite.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan: #00e5ff;
      --violet: #8b5cf6;
      --magenta: #ec4899;
      --green: #22d3ee;
      --neon: #a78bfa;
      --bg: #030014;
      --surface: rgba(15,10,40,0.7);
      --border: rgba(139,92,246,0.2);
      --glow-cyan: rgba(0,229,255,0.15);
      --glow-violet: rgba(139,92,246,0.15);
      --text: #c4b5fd;
      --text-bright: #f0e7ff;
      --input-bg: rgba(139,92,246,0.1);
      --input-border: rgba(139,92,246,0.3);
      --input-placeholder: rgba(196,181,253,0.5);
    }

    html { scroll-behavior: smooth; }
    html, body {
      width: 100%; min-height: 100vh;
      background: var(--bg);
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── ANIMATED BG ── */
    .bg-mesh {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      overflow: hidden;
    }
    .bg-orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4;
      animation: orbFloat 20s ease-in-out infinite;
    }
    .bg-orb:nth-child(1) {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(139,92,246,0.3), transparent 70%);
      top: -10%; left: -10%;
      animation-duration: 25s;
    }
    .bg-orb:nth-child(2) {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,229,255,0.2), transparent 70%);
      top: 40%; right: -15%;
      animation-duration: 30s; animation-delay: -5s;
    }
    .bg-orb:nth-child(3) {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(236,72,153,0.15), transparent 70%);
      bottom: -5%; left: 30%;
      animation-duration: 22s; animation-delay: -10s;
    }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -40px) scale(1.05); }
      66% { transform: translate(-20px, 30px) scale(0.95); }
    }

    /* Grid lines */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(139,92,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139,92,246,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    }

    .container {
      position: relative; z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ── NAV ── */
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 0;
    }
    .logo {
      font-size: 1.4rem; font-weight: 700; letter-spacing: 3px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 8px; }
    .nav-links a {
      color: var(--text); text-decoration: none;
      font-size: 0.9rem; font-weight: 500;
      padding: 8px 16px; border-radius: 8px;
      transition: all 0.2s;
    }
    .nav-links a:hover { background: var(--glow-violet); color: var(--text-bright); }

    /* ── MAIN CONTENT ── */
    .content-wrapper {
      min-height: calc(100vh - 180px); /* Adjust based on nav and footer height */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 0;
      text-align: center;
    }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px;
      backdrop-filter: blur(20px);
      max-width: 500px;
      width: 100%;
    }

    .form-card h1 {
      font-size: 2.2rem; font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 16px;
    }

    .form-card p {
      font-size: 1rem; color: rgba(196,181,253,0.65);
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .invite-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .invite-form input[type="text"] {
      padding: 14px 20px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-bright);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      width: 100%;
    }

    .invite-form input[type="text"]::placeholder {
      color: var(--input-placeholder);
    }

    .invite-form input[type="text"]:focus {
      outline: none;
      border-color: var(--neon);
      box-shadow: 0 0 0 3px rgba(167,139,250,0.2);
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 32px; border-radius: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem; font-weight: 600;
      text-decoration: none; border: none; cursor: pointer;
      transition: all 0.25s;
    }
    .btn-glow {
      background: linear-gradient(135deg, var(--violet), var(--magenta));
      color: #fff;
      box-shadow: 0 0 30px rgba(139,92,246,0.3), 0 4px 15px rgba(139,92,246,0.2);
    }
    .btn-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(139,92,246,0.4), 0 8px 25px rgba(139,92,246,0.3);
    }
    .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .message-area {
      margin-top: 20px;
      font-size: 0.95rem;
      min-height: 20px;
    }

    .message-area.success {
      color: var(--green);
    }

    .message-area.error {
      color: var(--magenta);
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 40px 0;
      text-align: center;
    }
    footer .footer-links {
      display: flex; gap: 24px; justify-content: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    footer a {
      color: rgba(196,181,253,0.5); text-decoration: none;
      font-size: 0.9rem;
    }
    footer a:hover { color: var(--neon); }
    footer .tagline {
      color: rgba(196,181,253,0.25);
      font-size: 0.8rem;
    }
    @media (max-width: 768px) {
      .form-card { padding: 30px 20px; }
      .form-card h1 { font-size: 1.8rem; }
      .form-card p { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <!-- Background effects -->
  <div class="bg-mesh">
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
  </div>
  <div class="bg-grid"></div>

  <div class="container">
    <!-- Nav -->
    <nav>
      <a href="/" class="logo">NEXAL</a>
      <div class="nav-links">
        <a href="/nexal/explore.html">Explorer</a>
        <a href="/nexal/index.html#quickstart">Get Started</a>
        <a href="/nexal/bring-agent.html">Bring Agent</a>
        <a href="/nexal/docs.html">API Docs</a>
        <a href="https://github.com/stellamariesays/Manifold" target="_blank">GitHub</a>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="content-wrapper">
      <div class="form-card">
        <h1>Redeem Your Invite Token</h1>
        <p>Enter your unique invite token below to get access to a managed hub and dashboard.</p>
        <form id="inviteForm" class="invite-form">
          <input type="text" id="inviteToken" placeholder="Enter your invite token" required>
          <button type="submit" class="btn btn-glow" id="redeemButton">Redeem Token</button>
        </form>
        <div id="messageArea" class="message-area"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <div class="footer-links">
        <a href="/nexal/explore.html">Explorer</a>
        <a href="/nexal/index.html#quickstart">Get Started</a>
        <a href="/nexal/bring-agent.html">Bring Agent</a>
        <a href="/nexal/docs.html">API Docs</a>
        <a href="https://github.com/stellamariesays/Manifold" target="_blank">GitHub</a>
      </div>
      <p class="tagline">NEXAL is an open initiative by Manifold Federation.</p>
    </footer>
  </div>

  <script>
    document.getElementById('inviteForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const inviteToken = document.getElementById('inviteToken').value;
      const messageArea = document.getElementById('messageArea');
      const redeemButton = document.getElementById('redeemButton');

      messageArea.textContent = '';
      messageArea.className = 'message-area';
      redeemButton.disabled = true;
      redeemButton.textContent = 'Redeeming...';

      try {
        // Mock API call for now. Replace with actual API endpoint later.
        // The prompt states "Caddy proxies API routes to localhost:8767 (REST)"
        // So, a POST to /api/invite/redeem could be mapped to localhost:8767/invite/redeem
        const response = await fetch('/public/invites/redeem', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ token: inviteToken }),
        });

        const data = await response.json();

        if (response.ok) {
          messageArea.classList.add('success');
          messageArea.innerHTML = `Token redeemed successfully! Your hub is being provisioned. <a href="/nexal/getting-started.html" style="color:var(--cyan);">Get started here</a>.`;
        } else {
          messageArea.classList.add('error');
          messageArea.textContent = data.message || 'Failed to redeem token. Please try again or check your token.';
        }
      } catch (error) {
        console.error('Error:', error);
        messageArea.classList.add('error');
        messageArea.textContent = 'An unexpected error occurred. Please try again later.';
      } finally {
        redeemButton.disabled = false;
        redeemButton.textContent = 'Redeem Token';
      }
    });
  </script>
</body>
</html>
