<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Manifold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan:   #00e5ff;
      --violet: #aa00ff;
      --green:  #00ff88;
      --pink:   #ff0077;
      --bg:     #000510;
      --panel:  rgba(0, 8, 24, 0.88);
      --border: rgba(0,229,255,0.22);
      --text:   #b0e0f8;
      --bar-h:  60px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: 'Rajdhani', monospace;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── 3D Canvas ─────────────────────────────────────────────────── */
    #scene {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: block;
      touch-action: none;
      z-index: 1;
    }

    /* ── Top Status Bar ────────────────────────────────────────────── */
    #m-topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 52px;
      background: linear-gradient(180deg, rgba(0,5,16,0.9) 0%, transparent 100%);
      display: flex; align-items: center;
      padding: 0 16px;
      z-index: 30;
      gap: 10px;
    }

    #m-topbar .logo {
      font-size: 20px; font-weight: 700;
      letter-spacing: 6px; color: var(--cyan);
      text-shadow: 0 0 16px var(--cyan);
    }

    #m-topbar .status-pill {
      display: flex; align-items: center; gap: 5px;
      background: rgba(0,229,255,0.08);
      border: 1px solid rgba(0,229,255,0.2);
      border-radius: 20px;
      padding: 3px 10px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px; color: var(--cyan);
      margin-left: auto;
    }

    #m-topbar .status-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Bottom Action Bar ─────────────────────────────────────────── */
    #m-actionbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(var(--bar-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: linear-gradient(0deg, rgba(0,5,16,0.95) 0%, transparent 100%);
      display: flex; align-items: center; justify-content: space-around;
      z-index: 30;
    }

    .m-action-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; cursor: pointer;
      padding: 8px 18px;
      -webkit-tap-highlight-color: transparent;
    }

    .m-action-btn .icon {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      transition: all 0.2s;
    }

    .m-action-btn .label {
      font-size: 9px; letter-spacing: 1px;
      text-transform: uppercase; color: rgba(176,224,248,0.5);
    }

    .m-action-btn.cyan .icon {
      background: rgba(0,229,255,0.12);
      border: 1px solid rgba(0,229,255,0.3);
      color: var(--cyan);
    }

    .m-action-btn.violet .icon {
      background: rgba(170,0,255,0.12);
      border: 1px solid rgba(170,0,255,0.3);
      color: var(--violet);
    }

    .m-action-btn.green .icon {
      background: rgba(0,255,136,0.1);
      border: 1px solid rgba(0,255,136,0.25);
      color: var(--green);
    }

    .m-action-btn:active .icon {
      transform: scale(0.88);
      filter: brightness(1.4);
    }

    /* ── Agent Drawer (slides up from bottom) ──────────────────────── */
    #m-drawer {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 55vh;
      background: var(--panel);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      z-index: 40;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column;
      padding-bottom: var(--safe-b);
    }

    #m-drawer.open { transform: translateY(0); }

    .drawer-handle {
      width: 36px; height: 4px; border-radius: 2px;
      background: rgba(0,229,255,0.25);
      margin: 12px auto 0;
      flex-shrink: 0;
    }

    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px 10px;
      flex-shrink: 0;
    }

    .drawer-title {
      font-size: 12px; letter-spacing: 2px;
      color: var(--cyan); text-transform: uppercase;
      display: flex; align-items: center; gap: 6px;
    }

    .drawer-close {
      background: none; border: none; cursor: pointer;
      color: rgba(176,224,248,0.4); font-size: 18px; line-height: 1;
      padding: 4px;
    }

    #m-drawer-list {
      flex: 1; overflow-y: auto;
      padding: 0 16px 16px;
      -webkit-overflow-scrolling: touch;
    }

    .drawer-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid rgba(0,229,255,0.07);
      cursor: pointer;
      transition: background 0.15s;
    }

    .drawer-row:active { background: rgba(0,229,255,0.06); border-radius: 4px; }

    .drawer-dot {
      width: 7px; height: 7px; border-radius: 50%;
      flex-shrink: 0;
    }

    .drawer-name {
      flex: 1; font-size: 13px; color: var(--text);
    }

    .drawer-hub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px; color: rgba(176,224,248,0.35);
    }

    /* ── Agent/Hub Info Card (slides up on tap) ────────────────────── */
    #m-card {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--panel);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      z-index: 50;
      padding: 20px 24px calc(24px + var(--safe-b));
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #m-card.visible { transform: translateY(0); }

    .card-handle {
      width: 36px; height: 4px; border-radius: 2px;
      background: rgba(0,229,255,0.2);
      margin: 0 auto 16px;
    }

    #m-card-title {
      font-size: 22px; font-weight: 700;
      color: var(--cyan); letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(0,229,255,0.4);
      margin-bottom: 4px;
    }

    #m-card-sub {
      font-size: 10px; letter-spacing: 2px;
      color: rgba(176,224,248,0.4);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    #m-card-body {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px; line-height: 1.7;
      color: rgba(176,224,248,0.7);
    }

    .card-dismiss {
      position: absolute; top: 16px; right: 20px;
      background: none; border: none; cursor: pointer;
      color: rgba(176,224,248,0.35); font-size: 20px;
      padding: 4px;
    }

    /* ── Query Sheet (slides up from bottom) ───────────────────────── */
    #m-query-sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 75vh;
      background: var(--panel);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      z-index: 60;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column;
      padding-bottom: var(--safe-b);
    }

    #m-query-sheet.open { transform: translateY(0); }

    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px 10px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(0,229,255,0.1);
    }

    .sheet-title {
      font-size: 12px; letter-spacing: 2px;
      color: var(--cyan); text-transform: uppercase;
    }

    .sheet-close {
      background: none; border: none; cursor: pointer;
      color: rgba(176,224,248,0.4); font-size: 20px; padding: 4px;
    }

    .sheet-body {
      flex: 1; overflow-y: auto; padding: 16px 20px;
      display: flex; flex-direction: column; gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .sheet-body textarea {
      width: 100%; flex: 1; min-height: 120px;
      background: rgba(0,229,255,0.04);
      border: 1px solid rgba(0,229,255,0.2);
      border-radius: 6px;
      padding: 12px;
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px; line-height: 1.5;
      resize: none; outline: none;
    }

    .sheet-body textarea:focus {
      border-color: var(--cyan);
    }

    .sheet-actions {
      display: flex; gap: 10px; flex-shrink: 0;
    }

    .btn-preset {
      padding: 10px 14px;
      background: rgba(170,0,255,0.1);
      border: 1px solid rgba(170,0,255,0.3);
      border-radius: 6px;
      color: var(--violet);
      font-size: 11px; letter-spacing: 1px;
      cursor: pointer; white-space: nowrap;
    }

    .btn-send {
      flex: 1; padding: 12px;
      background: rgba(0,229,255,0.08);
      border: 1px solid var(--cyan);
      border-radius: 6px;
      color: var(--cyan);
      font-family: 'Rajdhani', monospace;
      font-size: 14px; font-weight: 600;
      letter-spacing: 3px; text-transform: uppercase;
      cursor: pointer;
    }

    .btn-send:disabled { opacity: 0.5; }
    .btn-preset:active, .btn-send:active { filter: brightness(1.3); }

    #m-query-out {
      display: none;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(0,229,255,0.1);
      border-radius: 6px;
      padding: 12px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px; line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
    }

    /* ── Dim backdrop when a sheet is open ─────────────────────────── */
    #m-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 35;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }

    #m-backdrop.visible { opacity: 1; pointer-events: all; }
  </style>
</head>
<body>

<!-- 3D Scene -->
<canvas id="scene"></canvas>

<!-- Top bar -->
<div id="m-topbar">
  <div class="logo">MANIFOLD</div>
  <div class="status-pill">
    <div class="status-dot"></div>
    <span id="m-agent-count">—</span>&nbsp;agents
  </div>
</div>

<!-- Bottom action bar -->
<div id="m-actionbar">
  <button class="m-action-btn cyan" onclick="window._mToggleDrawer(); _backdrop(true)">
    <div class="icon">⬡</div>
    <div class="label">Agents</div>
  </button>
  <button class="m-action-btn violet" onclick="window._mOpenQuery(); _backdrop(true)">
    <div class="icon">↗</div>
    <div class="label">Query</div>
  </button>
  <button class="m-action-btn green" onclick="_rotateToggle()">
    <div class="icon" id="rotate-icon">⟳</div>
    <div class="label">Orbit</div>
  </button>
</div>

<!-- Dim backdrop -->
<div id="m-backdrop" onclick="_closeAll()"></div>

<!-- Agent drawer -->
<div id="m-drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <div class="drawer-title"><span style="color:var(--green);animation:pulse 2s infinite">●</span> Active Agents</div>
    <button class="drawer-close" onclick="_closeAll()">×</button>
  </div>
  <div id="m-drawer-list">
    <div style="font-size:11px;color:rgba(176,224,248,0.3);text-align:center;padding:20px;">Loading mesh…</div>
  </div>
</div>

<!-- Agent / Hub info card -->
<div id="m-card">
  <button class="card-dismiss" onclick="window._mHideCard()">×</button>
  <div class="card-handle"></div>
  <div id="m-card-title">—</div>
  <div id="m-card-sub">—</div>
  <div id="m-card-body"></div>
</div>

<!-- Query sheet -->
<div id="m-query-sheet">
  <div class="sheet-header">
    <div class="sheet-title">Federation Query</div>
    <button class="sheet-close" onclick="window._mCloseQuery(); _backdrop(false)">×</button>
  </div>
  <div class="sheet-body">
    <textarea id="m-query-input" placeholder="Ask the mesh…" rows="5"></textarea>
    <div class="sheet-actions">
      <button class="btn-preset" onclick="window._mLoadPreset()">Load Preset</button>
      <button class="btn-send" id="m-query-btn" onclick="window._mSubmitQuery()">Send</button>
    </div>
    <div id="m-query-out"></div>
  </div>
</div>

<script>
// Backdrop + close helpers (plain JS, no module needed)
function _backdrop(show) {
  document.getElementById('m-backdrop').classList.toggle('visible', show);
}

function _closeAll() {
  document.getElementById('m-drawer').classList.remove('open');
  document.getElementById('m-query-sheet').classList.remove('open');
  _backdrop(false);
}

function _rotateToggle() {
  const controls = window.cameraControls;
  if (!controls) return;
  controls.autoRotate = !controls.autoRotate;
  document.getElementById('rotate-icon').style.color =
    controls.autoRotate ? 'var(--green)' : 'rgba(176,224,248,0.4)';
}

// Session guard
const token = localStorage.getItem('nexal_token');
if (!token) window.location.replace('/nexal/login.html');

const user = localStorage.getItem('nexal_user');
if (user) document.title = `Manifold · ${user}`;
</script>

<script type="module" src="./nexal-mobile.js"></script>
</body>
</html>
